    version: 2.2.2
  - name: ansible.utils
    version: 6.1.1
  - name: community.aws
    version: 11.2.0
  - name: community.crypto
    version: 3.5.0
  - name: community.docker
    version: 5.4.0
  - name: community.general
    version: 13.5.0
