---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # molecule and molecule-plugins for the action (requirements/molecule.txt)
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
  # tools of the lint image (dockerfiles/lint-requirements.txt)
  - package-ecosystem: "pip"
    directory: "/dockerfiles"
    schedule:
      interval: "weekly"
