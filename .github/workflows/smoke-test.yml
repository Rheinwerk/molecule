---
# Runs the reusable role workflow against a small reference role with the action, the scenario
# and the collections of THIS ref, so changes are tested here before they reach all roles via @main.
name: Smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - action.yml
      - dockerfiles/collections.yml
      - scenarios/**
      - .github/workflows/role.yml
      - .github/workflows/smoke-test.yml
  push:
    branches:
      - main
    paths:
      - action.yml
      - dockerfiles/collections.yml
      - scenarios/**
      - .github/workflows/role.yml
      - .github/workflows/smoke-test.yml

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transparent-hugepage-setup:
    uses: ./.github/workflows/role.yml
    with:
      role_repository: Rheinwerk/ansible-role-transparent_hugepage_setup
      role_ref: master
      # molecule always runs for a foreign role repository, no force_run needed
      molecule_ref: ${{ github.event.pull_request.head.sha || github.sha }}
