# Reusable workflow: molecule on real EC2 instances from the account's baseimage AMI (scenarios/ec2).
# The AWS role trusts this file by path (job_workflow_ref), so keep the name and run it only on
# demand: see README.md "EC2 scenario" and examples/molecule-ec2.yml.
name: Role CI on EC2

on:
  workflow_call:
    secrets:
      # a secret, not an input: inputs are printed in the (public) log, secrets are masked
      MOLECULE_EC2_ROLE_ARN:
        description: IAM role to assume via GitHub OIDC
        required: true
    inputs:
      subnet_id:
        description: Subnet for the instances (public IPs, no route to internal services)
        type: string
        required: true
      security_group_id:
        description: Security group for the instances (SSH in, all out)
        type: string
        required: true
      aws_region:
        description: AWS region of the subnet and the AMIs
        type: string
        default: eu-central-1
      image_env:
        description: Value of the AMIs' Env tag to pick, empty for any
        type: string
        default: staging
      args:
        description: Additional arguments passed to molecule test
        type: string
        default: ''
      # Instance types must match arch (t3 = amd64, t4g = arm64)
      matrix:
        description: >-
          JSON list of matrix entries with distro, ansible_scenario, experimental and optionally
          python_version, arch and instance_type
        type: string
        default: >-
          [{"distro": "debian-13", "ansible_scenario": "ansible_current", "experimental": false, "python_version": "3.13"}]
      python_version:
        description: Python version for the molecule virtualenv, unless the matrix entry sets one
        type: string
        default: '3.12'
      molecule_ref:
        description: Ref of Rheinwerk/molecule to take the action, the scenario and the collections from
        type: string
        default: main
      role_repository:
        description: Repository of the role under test, defaults to the calling repository
        type: string
        default: ''
      role_ref:
        description: Ref of the role under test, defaults to the triggering ref
        type: string
        default: ''

# id-token: write lets the job request the OIDC token; the calling job has to grant it as well
permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  molecule:
    name: Molecule EC2 ${{ matrix.ansible_scenario }} / ${{ matrix.distro }} / ${{ matrix.arch || 'amd64' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    # destroy.yml terminates the instances; the instances also power off on their own after 90 minutes
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    env:
      MOLECULE_EC2_REGION: ${{ inputs.aws_region }}
      MOLECULE_EC2_SUBNET_ID: ${{ inputs.subnet_id }}
      MOLECULE_EC2_SECURITY_GROUP_ID: ${{ inputs.security_group_id }}
      MOLECULE_EC2_IMAGE_ENV: ${{ inputs.image_env }}
      MOLECULE_EC2_ARCH: ${{ matrix.arch || 'amd64' }}
      MOLECULE_EC2_INSTANCE_TYPE: ${{ matrix.instance_type || 't3.small' }}
    steps:
      - name: Check out the molecule action
        uses: actions/checkout@v7
        with:
          repository: Rheinwerk/molecule
          ref: ${{ inputs.molecule_ref }}
          path: git_molecule

      # pinned to a commit: this action handles the AWS credentials (Renovate updates digest and comment)
      - name: Get AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ secrets.MOLECULE_EC2_ROLE_ARN }}
          role-session-name: molecule-${{ github.run_id }}-${{ github.run_attempt }}
          # longer than the job timeout, so destroy still has credentials (the role allows 2 h)
          role-duration-seconds: 5400
          aws-region: ${{ inputs.aws_region }}
          # keeps the account ID out of the public log
          mask-aws-account-id: true

      - name: Run molecule
        uses: ./git_molecule
        with:
          distro: ${{ matrix.distro }}
          ansible_scenario: ${{ matrix.ansible_scenario }}
          python_version: ${{ matrix.python_version || inputs.python_version }}
          molecule_scenario: ec2
          molecule_args: ${{ inputs.args }}
          molecule_ref: ${{ inputs.molecule_ref }}
          role_repository: ${{ inputs.role_repository }}
          role_ref: ${{ inputs.role_ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
