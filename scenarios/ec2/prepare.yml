---
# Runs before the role under test: stop if the image still holds the secrets that
# files/wipe-image-secrets.sh removes at boot.
- name: Prepare
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Find apt credentials
      ansible.builtin.find:
        paths: /etc/apt/auth.conf.d
      register: prepare_apt_auth

    - name: Read the effective sshd configuration
      ansible.builtin.command: sshd -T
      changed_when: false
      register: prepare_sshd

    - name: Check that the image secrets are gone
      ansible.builtin.assert:
        that:
          - prepare_apt_auth.files | length == 0
          - prepare_sshd_host_keys | reject('match', '/etc/ssh/ssh_host_') | list | length == 0
          - prepare_sshd.stdout_lines | select('match', 'hostcertificate ') | list | length == 0
        fail_msg: >-
          The boot-time wipe did not run or failed, see /var/log/cloud-init-output.log on the instance.
          Not converging the role on an image that still holds its secrets.
        quiet: true
      vars:
        prepare_sshd_host_keys: >-
          {{ prepare_sshd.stdout_lines | select('match', 'hostkey ') | map('regex_replace', '^hostkey ', '') | list }}
